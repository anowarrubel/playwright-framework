version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The Playwright version is pinned to the CI container image tag; take
    # majors by hand.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@playwright/test'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
