name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly QA-env regression at 02:00 UTC.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'qa'
        type: choice
        options: [dev, qa, prod]
      site:
        description: 'Site to run (leave blank for all)'
        required: false
        default: ''
        type: choice
        options: ['', 'demoqa', 'academybugs', 'saucedemo']
      suite:
        description: 'Suite to run'
        required: true
        default: 'all'
        type: choice
        options: [all, functional, accessibility, security, seo, analytics, performance, responsive, api, visual, i18n]
      update_snapshots:
        description: 'Visual suite: regenerate baselines instead of comparing (download them from the artifacts and commit)'
        required: false
        default: false
        type: boolean

concurrency:
  group: playwright-${{ github.ref }}-${{ github.event_name }}-${{ inputs.environment || 'qa' }}-${{ inputs.site || 'all' }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.project }} • ${{ inputs.environment || 'qa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Browsers and system packages are baked into this image, so there is no
    # download to hang. Keep the tag equal to the Playwright version in
    # package-lock.json (the check step below fails clearly if they drift).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host

    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    env:
      TEST_ENV: ${{ inputs.environment || 'qa' }}
      SITE: ${{ inputs.site || '' }}
      SUITE: ${{ inputs.suite || 'all' }}
      UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots && 'true' || 'false' }}
      # Visual baselines are per OS: only compare once Linux ones are committed.
      RUN_VISUAL: ${{ inputs.suite == 'visual' && '1' || '' }}
      PROJECT: ${{ matrix.project }}
      # Firefox refuses to start in the container unless HOME is owned by the current user.
      HOME: /root
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME || 'standard_user' }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD || 'secret_sauce' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Playwright matches the container image
        env:
          IMAGE_PLAYWRIGHT_VERSION: '1.64.1'
        run: |
          installed="$(npx playwright --version | awk '{print $2}')"
          test "$installed" = "$IMAGE_PLAYWRIGHT_VERSION" || {
            echo "package-lock.json has Playwright $installed but the container image is $IMAGE_PLAYWRIGHT_VERSION" >&2
            exit 1
          }

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Playwright tests
        run: |
          case "$SUITE" in
            functional)    DIR="tests/functional" ;;
            accessibility) DIR="tests/accessibility" ;;
            security)      DIR="tests/security" ;;
            seo)           DIR="tests/seo" ;;
            analytics)     DIR="tests/analytics" ;;
            performance)   DIR="tests/performance" ;;
            responsive)    DIR="tests/responsive" ;;
            api)           DIR="tests/api" ;;
            visual)        DIR="tests/visual" ;;
            i18n)          DIR="tests/i18n" ;;
            *)             DIR="" ;;
          esac
          EXTRA=""
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then EXTRA="--update-snapshots"; fi
          # Chromium-only suites leave nothing to run in the other browser jobs.
          npx playwright test $DIR --project="$PROJECT" $EXTRA --pass-with-no-tests

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}-${{ inputs.environment || 'qa' }}
          path: playwright-report
          retention-days: 14

      - name: Upload visual baselines
        if: inputs.update_snapshots
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-${{ matrix.project }}
          path: tests/visual/**/*-snapshots
          retention-days: 7

      - name: Upload test-results (traces, videos, axe JSON)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.project }}-${{ inputs.environment || 'qa' }}
          path: test-results
          retention-days: 7

  summary:
    name: Aggregate summary
    needs: test
    if: always()
    runs-on: ubuntu-latest
    env:
      TEST_ENV: ${{ inputs.environment || 'qa' }}
      SITE: ${{ inputs.site || 'all' }}
      SUITE: ${{ inputs.suite || 'all' }}
      TRIGGER: ${{ github.event_name }}
    steps:
      - name: Write run summary
        run: |
          {
            echo "## Playwright run summary"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Environment | \`$TEST_ENV\` |"
            echo "| Site | \`$SITE\` |"
            echo "| Suite | \`$SUITE\` |"
            echo "| Trigger | \`$TRIGGER\` |"
            echo ""
            echo "Download HTML reports from the **Artifacts** section of this run."
          } >> "$GITHUB_STEP_SUMMARY"
